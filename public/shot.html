<style>html,body{margin:0;background:#fff} iframe{border:0;display:block}</style>
<iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search)
const f = document.getElementById('f')
f.style.width = (q.get('w') || 390) + 'px'
f.style.height = (q.get('h') || 844) + 'px'
f.src = q.get('r') || '/'
f.addEventListener('load', () => setTimeout(() => {
  const d = f.contentDocument
  if (q.get('reveal')) {
    // A stylesheet, not inline styles: React rewrites the elements as it
    // renders and puts its own opacity back.
    const st = d.createElement('style')
    st.textContent = '*{opacity:1 !important; transition:none !important}'
    d.head.appendChild(st)
  }
  const y = Number(q.get('y') || 0)
  if (y) f.contentWindow.scrollTo(0, y)
}, 1500))
</script>
