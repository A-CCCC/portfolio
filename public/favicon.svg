<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- An orange, with a bite out of it. The fruit on its own, the way a
       certain apple stands on its own, and in glass rather than paint: lit
       from the upper left, the shade gathering along the underside, and the
       edge catching the light again on the far side, which is what a thick
       curved surface does with it.

       The silhouette is one path: the fruit's circle, then the bite's circle
       cut back across it, level with the fruit's middle. Everything else is clipped to that path, so the
       bite goes through the gloss and the shade and the glass edge alike.

       A tab draws this at about sixteen pixels across, so everything here is a
       soft gradient — at that size a hard highlight is a smudge — and the fruit
       is as large as the box allows, with the leaf tucked into the corner it
       leaves free. -->
  <defs>
    <!-- the flesh: lit from the upper left, deepest at the far side -->
    <radialGradient id="flesh" cx="23" cy="26" r="37" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffdcb4"/>
      <stop offset="0.45" stop-color="#ffbb6f"/>
      <stop offset="1" stop-color="#ef8f36"/>
    </radialGradient>

    <!-- the gloss where the light strikes -->
    <radialGradient id="gleam" cx="23" cy="24" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- the shade gathering along the underside -->
    <radialGradient id="shade" cx="39" cy="55" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b95d14" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#b95d14" stop-opacity="0"/>
    </radialGradient>

    <!-- the edge, bright where the light enters and again where it leaves -->
    <linearGradient id="rim" x1="12" y1="14" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="leaf" x1="34" y1="13" x2="49" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a9e2f"/>
      <stop offset="0.6" stop-color="#8fca55"/>
      <stop offset="1" stop-color="#d4eea6"/>
    </linearGradient>

    <clipPath id="orb"><path d="M54.41 25.91 A25 25 0 1 0 54.41 48.09 A12 12 0 0 1 54.41 25.91 Z"/></clipPath>
  </defs>

  <!-- the fruit -->
  <path d="M54.41 25.91 A25 25 0 1 0 54.41 48.09 A12 12 0 0 1 54.41 25.91 Z" fill="url(#flesh)"/>
  <g clip-path="url(#orb)">
    <rect width="64" height="64" fill="url(#shade)"/>
    <rect width="64" height="64" fill="url(#gleam)"/>
  </g>
  <!-- one sharp point of light, where the room's window would be -->
  <ellipse cx="22.5" cy="24" rx="5" ry="3.2" fill="#ffffff" fill-opacity="0.7"
           transform="rotate(-32 22.5 24)"/>
  <!-- drawn on the outline and clipped to it, so half the stroke shows —
       along the bite as well, where the glass has been cut -->
  <path d="M54.41 25.91 A25 25 0 1 0 54.41 48.09 A12 12 0 0 1 54.41 25.91 Z" fill="none" stroke="url(#rim)" stroke-width="3" clip-path="url(#orb)"/>

  <!-- the stem, and one leaf off it -->
  <path d="M32 13 V8" stroke="#6d4a1c" stroke-width="3" stroke-linecap="round"/>
  <path d="M33.5 11 C36 3 45 1 50.5 3 C48.5 10 40.5 14 33.5 11 Z" fill="url(#leaf)"/>
  <path d="M35 10 C39 6 44 4 49 3.5" fill="none" stroke="#ffffff" stroke-opacity="0.55"
        stroke-width="0.9" stroke-linecap="round"/>
</svg>
